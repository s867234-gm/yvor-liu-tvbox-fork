name: 自动同步更新天神IY配置

on:
  schedule:
    # 设定每2天的北京时间凌晨 04:00 (UTC 20:00) 自动检查并更新
    - cron: '0 20 */2 * *'
  # 支持在 GitHub 网页 Actions 界面手动一键点击运行测试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 执行动态差异同步
        run: |
          python - << 'EOF'
          import urllib.request
          import urllib.parse
          import json
          import os
          import sys

          # 本地 A 文件名
          LOCAL_FILE_A = "天神IY(4K)MM"
          # 上游 B 文件原始地址
          UPSTREAM_URL_B = "https://raw.githubusercontent.com/yvor-liu/tvbox/main/" + urllib.parse.quote("天神IY.txt")

          # 1. 读取本地当前 A 文件
          if not os.path.exists(LOCAL_FILE_A):
              print(f"❌ 错误: 未找到本地文件 {LOCAL_FILE_A}")
              sys.exit(1)

          with open(LOCAL_FILE_A, "r", encoding="utf-8") as f:
              try:
                  data_a = json.load(f)
              except Exception as e:
                  print(f"❌ 解析本地 A 文件 JSON 失败: {e}")
                  sys.exit(1)

          # 2. 从 GitHub 获取上游最新 B 文件
          print(f"⬇️ 正在获取上游 B 文件: {UPSTREAM_URL_B}")
          req = urllib.request.Request(UPSTREAM_URL_B, headers={"User-Agent": "Mozilla/5.0"})
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data_b = json.loads(resp.read().decode("utf-8"))
          except Exception as e:
              print(f"❌ 获取或解析上游 B 文件失败: {e}")
              sys.exit(1)

          # 3. 建立 B 文件的站源索引（优先匹配 key，备用匹配 name）
          b_sites_by_key = {s["key"]: s for s in data_b.get("sites", []) if "key" in s}
          b_sites_by_name = {s["name"]: s for s in data_b.get("sites", []) if "name" in s}

          changes = []

          # 4. 动态检查 A 当前的所有 sites 并进行更新
          current_sites_a = data_a.get("sites", [])
          updated_sites_a = []

          for site in current_sites_a:
              k = site.get("key")
              n = site.get("name")
              matched_b = None

              if k and k in b_sites_by_key:
                  matched_b = b_sites_by_key[k]
              elif n and n in b_sites_by_name:
                  matched_b = b_sites_by_name[n]

              if matched_b:
                  if site != matched_b:
                      changes.append(f"更新站源配置: [{k or n}] -> {matched_b.get('name')}")
                  updated_sites_a.append(matched_b)
              else:
                  changes.append(f"保留自定义站源（上游无对应项）: [{k or n}]")
                  updated_sites_a.append(site)

          data_a["sites"] = updated_sites_a

          # 5. 同步 spider 爬虫包（站源更新往往强依赖对应版本的 spider.jar）
          if "spider" in data_a and "spider" in data_b:
              if data_a["spider"] != data_b["spider"]:
                  changes.append("更新 spider 爬虫包地址")
                  data_a["spider"] = data_b["spider"]

          # 6. 同步壁纸、logo、公告等全局属性（如果 A 中存在）
          for header_key in ["wallpaper", "logo", "warningText", "danmaku"]:
              if header_key in data_a and header_key in data_b:
                  if data_a[header_key] != data_b[header_key]:
                      changes.append(f"更新全局属性: {header_key}")
                      data_a[header_key] = data_b[header_key]

          # 7. 写入更新后的 A 文件（保持标准 2 空格格式）
          output_content = json.dumps(data_a, ensure_ascii=False, indent=2) + "\n"
          with open(LOCAL_FILE_A, "w", encoding="utf-8") as f:
              f.write(output_content)

          print("\n--- 本次同步诊断结果 ---")
          if changes:
              for c in changes:
                  print(f"  • {c}")
          else:
              print("  • 当前 A 文件与 B 文件对应项一致，无需修改。")
          EOF

      - name: 提交并推送到仓库
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add "天神IY(4K)MM"
          if git diff --staged --quiet; then
            echo "✅ 检查完成：文件内容无变动，跳过提交。"
          else
            git commit -m "chore: 自动同步上游最新配置 [skip ci]"
            git push
            echo "🚀 成功：已将更新推送到仓库！"
          fi
