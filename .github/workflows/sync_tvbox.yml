name: 自动同步更新天神IY配置

on:
  schedule:
    # 每2天自动检查更新一次 (北京时间凌晨 04:00)
    - cron: '0 20 */2 * *'
  # 支持在 GitHub 网页 Actions 界面手动随时点击运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 执行动态同步
        run: |
          python - << 'EOF'
          import urllib.request
          import urllib.parse
          import json
          import os
          import sys

          LOCAL_FILE_A = "天神IY(4K)MM"
          UPSTREAM_URL_B = "https://raw.githubusercontent.com/yvor-liu/tvbox/main/" + urllib.parse.quote("天神IY.txt")

          # 1. 读取本地当前 A 文件
          if not os.path.exists(LOCAL_FILE_A):
              print(f"❌ 错误: 未找到本地文件 {LOCAL_FILE_A}")
              sys.exit(1)

          with open(LOCAL_FILE_A, "r", encoding="utf-8") as f:
              try:
                  data_a = json.load(f)
              except Exception as e:
                  print(f"❌ 解析本地 A 文件 JSON 失败: {e}")
                  sys.exit(1)

          # 2. 从 GitHub 获取上游最新 B 文件
          print(f"⬇️ 正在获取上游 B 最新文件...")
          req = urllib.request.Request(UPSTREAM_URL_B, headers={"User-Agent": "Mozilla/5.0"})
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data_b = json.loads(resp.read().decode("utf-8"))
          except Exception as e:
              print(f"❌ 获取或解析上游 B 文件失败: {e}")
              sys.exit(1)

          changes = []

          # 3. 动态更新 A 中现有的 sites（只更新 A 现有的站源，不拷贝 B 的多余站源）
          b_sites_by_key = {s["key"]: s for s in data_b.get("sites", []) if "key" in s}
          b_sites_by_name = {s["name"]: s for s in data_b.get("sites", []) if "name" in s}

          updated_sites = []
          for s_a in data_a.get("sites", []):
              k = s_a.get("key")
              n = s_a.get("name")
              matched = b_sites_by_key.get(k) or b_sites_by_name.get(n)
              if matched:
                  if s_a != matched:
                      target_name = matched.get("name")
                      changes.append(f"更新站源: [{k or n}] -> {target_name}")
                  updated_sites.append(matched)
              else:
                  changes.append(f"保留自定义站源: [{k or n}]")
                  updated_sites.append(s_a)
          data_a["sites"] = updated_sites

          # 4. 【按要求】将 B 中的 lives（直播项）完全覆盖同步到 A
          if "lives" in data_b:
              if data_a.get("lives") != data_b["lives"]:
                  changes.append("完全覆盖更新 lives 直播源列表")
              data_a["lives"] = data_b["lives"]

          # 5. 动态更新 parses（解析项，如果 A 中有）
          if "parses" in data_a and "parses" in data_b:
              b_parses_by_name = {p["name"]: p for p in data_b.get("parses", []) if "name" in p}
              updated_parses = []
              for p_a in data_a.get("parses", []):
                  name = p_a.get("name")
                  matched = b_parses_by_name.get(name)
                  if matched:
                      if p_a != matched:
                          changes.append(f"更新解析: [{name}]")
                      updated_parses.append(matched)
                  else:
                      updated_parses.append(p_a)
              data_a["parses"] = updated_parses

          # 6. 同步 spider 爬虫包地址
          if "spider" in data_a and "spider" in data_b:
              if data_a["spider"] != data_b["spider"]:
                  changes.append("更新 spider 爬虫包地址")
              data_a["spider"] = data_b["spider"]

          # 7. 同步 wallpaper, logo, warningText, danmaku 等全局属性
          for k in ["wallpaper", "logo", "warningText", "danmaku"]:
              if k in data_a and k in data_b:
                  if data_a[k] != data_b[k]:
                      changes.append(f"更新全局属性: {k}")
                  data_a[k] = data_b[k]

          # 8. 保存格式化后的 JSON
          output_content = json.dumps(data_a, ensure_ascii=False, indent=2) + "\n"
          with open(LOCAL_FILE_A, "w", encoding="utf-8") as f:
              f.write(output_content)

          print("\n--- 检查结果 ---")
          if changes:
              for c in changes:
                  print(f"  • {c}")
          else:
              print("  • 当前无任何变动。")
          EOF

      - name: 提交并推送到仓库
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add "天神IY(4K)MM"
          if git diff --staged --quiet; then
            echo "✅ 检查完成：无内容变动，跳过提交。"
          else
            git commit -m "chore: 自动同步上游最新配置 [skip ci]"
            git push
            echo "🚀 成功：已将更新推送到仓库！"
          fi
